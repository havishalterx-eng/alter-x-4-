syntax = "proto3";

package alter.compiler.v1;

service CompilerService {
  rpc CompileWorkflow(CompileWorkflowRequest) returns (CompileWorkflowResponse);
  rpc CompileArchitectureWorkflow(CompileArchitectureWorkflowRequest) returns (CompileWorkflowResponse);
  rpc ValidateWorkflowDag(ValidateWorkflowDagRequest) returns (ValidateWorkflowDagResponse);
}

// JSON is wire encoding only. Compiler validates it into its strict typed
// ArchitectureCompileInput before any lowering or persistence.
message CompileArchitectureWorkflowRequest {
  reserved 100 to 199;
  string tenant_id = 1;
  string workspace_id = 2;
  string workflow_id = 3;
  string architecture_json = 4;
  string binding_decision_json = 5;
  string dag_schema_version = 6;
}

message CompileWorkflowRequest {
  reserved 100 to 199;

  string tenant_id = 1; // ten_ prefixed UUIDv7
  string workflow_id = 2; // wf_ prefixed UUIDv7
  string task_skeleton_json = 3;
  string dag_schema_version = 4;
}

message CompileWorkflowResponse {
  reserved 100 to 199;

  string workflow_version_id = 1; // wfv_ prefixed UUIDv7
  string compiled_dag_json = 2;
  // Retired: the workflow_versions columns these mirrored were write-only and
  // were dropped in orchestration migration 0037. The compiler now returns "{}"
  // for both. Node requirements are resolved fresh, per node, at run time.
  //
  // Kept present rather than removed because `buf breaking`'s FIELD_NO_DELETE
  // is enforced on this repo's contracts and fires even when the number is
  // reserved -- the same retirement alter.binding.v1 uses for persona_json.
  string node_requirements_json = 3 [deprecated = true];
  string policy_bindings_json = 4 [deprecated = true];
}

message ValidateWorkflowDagRequest {
  reserved 100 to 199;

  string tenant_id = 1; // ten_ prefixed UUIDv7
  string workflow_id = 2; // wf_ prefixed UUIDv7
  string workflow_dag_json = 3;
}

message ValidateWorkflowDagResponse {
  reserved 100 to 199;

  bool valid = 1;
  repeated string issues_json = 2;
}
